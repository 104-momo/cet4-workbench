<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四级冲刺工作台 · 15周每日计划</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F2EA;
  --surface:#FFFFFF;
  --surface2:#FBF8F2;
  --ink:#22303C;
  --muted:#77818C;
  --line:#E7E0D3;
  --primary:#2C5F5A;
  --primary-deep:#244D49;
  --primary-soft:#E4EFEC;
  --accent:#E8633C;
  --accent-soft:#FBE9E2;
  --ok:#3E7C4F;
  --ok-soft:#E5F0E8;
  --warn:#B7791F;
  --warn-soft:#FBF3DF;
  --radius:14px;
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --font-body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);line-height:1.65;font-size:15px}
#errbar{display:none;position:fixed;left:0;right:0;top:0;width:100%;z-index:999;background:#7f1d1d;color:#fff;font-size:12px;padding:8px 14px;text-align:center;line-height:1.4}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D8D0BF;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:228px 1fr;min-height:100vh}
/* ===== 侧边栏 ===== */
.sidebar{background:var(--surface2);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav-item svg{flex:none}
.nav-item:hover{background:var(--primary-soft);color:var(--primary-deep)}
.nav-item.active{background:var(--primary);color:#fff}
.sidebar-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:14px 8px 0;border-top:1px dashed var(--line);line-height:1.7}

/* ===== 主区 ===== */
.main{padding:30px 34px 90px;min-width:0}
.view{display:none}
.view.active{display:block}
.hero{margin-bottom:22px}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:.5px}
.hero .todayline{color:var(--muted);font-size:13px;margin-top:6px}
.countdown{text-align:right}
.countdown .num{font-family:var(--font-display);font-weight:900;font-size:34px;color:var(--accent);line-height:1}
.countdown .lab{font-size:12px;color:var(--muted);margin-top:4px}

/* 15 格周进度带 */
.weeks{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin:18px 0 6px}
.week-cell{height:34px;border-radius:7px;background:#E8E1D2;position:relative;display:flex;align-items:center;justify-content:center}
.week-cell .w{font-size:9px;color:transparent}
.week-cell.filled{background:var(--primary)}
.week-cell.filled .w{color:#fff}
.week-cell.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.week-cell.cur .w{color:#fff;font-weight:700}
.weeks-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:20px}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px}
.card h2{font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-family:var(--font-body);font-size:11px;font-weight:500;background:var(--primary-soft);color:var(--primary-deep);padding:2px 9px;border-radius:20px}
.card .desc{color:var(--muted);font-size:13px;margin-top:4px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.progress-wrap{margin-top:12px}
.progress-track{height:9px;border-radius:6px;background:#EEE7D9;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;background:var(--primary);transition:width .4s}
.progress-text{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}

/* 阶段徽标 */
.phase-banner{display:flex;align-items:center;gap:14px;background:var(--primary);color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;flex-wrap:wrap}
.phase-banner .pb-tag{font-size:11px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px}
.phase-banner .pb-name{font-family:var(--font-display);font-weight:700;font-size:19px}
.phase-banner .pb-date{font-size:12px;opacity:.85}
.phase-banner .pb-right{margin-left:auto;text-align:right;font-size:12px;opacity:.9}

/* 提醒条 */
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid #EFDFB8;border-radius:12px;padding:12px 15px;font-size:13px;margin-bottom:16px}
.alert svg{flex:none;margin-top:2px}

/* 任务清单 */
.task-block{margin-bottom:18px}
.task-block-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:10px}
.task-block-title .blk-hint{font-size:11px;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface);transition:background .15s,border-color .15s}
.task-item:hover{border-color:#CFC6B2}
.task-item.done{background:var(--ok-soft);border-color:#CDE3D3}
.task-check{width:22px;height:22px;border-radius:7px;border:2px solid #C9C0AE;background:#fff;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.task-item.done .task-check{background:var(--ok);border-color:var(--ok)}
.task-check svg{opacity:0}
.task-item.done .task-check svg{opacity:1;color:#fff}
.task-text{flex:1;font-size:14px}
.task-item.done .task-text{color:var(--muted);text-decoration:line-through}
.task-link{font-size:12px;color:var(--primary);background:var(--primary-soft);padding:3px 10px;border-radius:20px;flex:none}
.task-link:hover{background:var(--primary);color:#fff}

/* 快捷入口 */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.quick a{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:transform .12s,border-color .12s,box-shadow .12s}
.quick a:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 16px rgba(34,48,60,.08)}
.quick .q-ic{color:var(--primary)}
.quick .q-name{font-weight:700;font-size:14px}
.quick .q-note{font-size:12px;color:var(--muted)}

/* 计划页时间线 */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl-node{position:relative;margin-bottom:16px}
.tl-node::before{content:"";position:absolute;left:-26px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.phase-head{display:flex;align-items:center;gap:12px;padding:16px 20px;flex-wrap:wrap}
.phase-dot{width:12px;height:12px;border-radius:4px;flex:none}
.phase-name{font-family:var(--font-display);font-weight:700;font-size:17px}
.phase-meta{font-size:12px;color:var(--muted)}
.phase-tag{margin-left:auto;font-size:11px;padding:3px 11px;border-radius:20px;font-weight:500}
.phase-desc{padding:0 20px 6px;color:var(--muted);font-size:13px}
.phase-body{padding:10px 20px 18px}
.phase-body h4{font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 6px;letter-spacing:1px}
.phase-body ul{padding-left:18px;color:var(--ink);font-size:13.5px}
.phase-body li{margin-bottom:5px}

/* 资源页 */
.res-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.res-cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.res-cat-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.res-cat-head .rc-ic{color:var(--primary)}
.res-cat h3{font-family:var(--font-display);font-weight:700;font-size:16px}
.res-cat .rc-desc{font-size:12px;color:var(--muted);margin-bottom:12px}
.res-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.res-item .ri-body{flex:1;min-width:0}
.res-item .ri-name{font-weight:700;font-size:13.5px}
.res-item:hover .ri-name{color:var(--primary)}
.res-item .ri-note{font-size:12px;color:var(--muted);margin-top:2px}
.res-item .ri-go{flex:none;color:var(--primary);margin-top:2px}
.external-note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}

/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .cal-month{font-family:var(--font-display);font-weight:700;font-size:18px}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--primary-soft);border-color:var(--primary)}
.cal-nav button:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cal-cell{min-height:56px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px;position:relative;font-size:11px}
.cal-cell.out{background:var(--surface2);color:#C4BBA6}
.cal-cell .d{font-weight:700;margin-bottom:4px}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-cell.done{background:var(--ok-soft);border-color:#CDE3D3}
.cal-cell.partial{background:var(--warn-soft);border-color:#EFDFB8}
.cal-cell.exam{background:var(--accent-soft);border-color:#F3C6B8}
.cal-bar{height:5px;border-radius:3px;background:var(--ok);margin-top:4px}
.cal-cell.partial .cal-bar{background:var(--warn)}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.cal-legend .lg-done{background:var(--ok-soft);border:1px solid #CDE3D3}
.cal-legend .lg-part{background:var(--warn-soft);border:1px solid #EFDFB8}
.cal-legend .lg-today{background:#fff;border:2px solid var(--accent)}

/* 底部标签栏（移动端） */
.tabbar{display:none}

@media (max-width:768px){
  body{font-size:14px}
  .app{display:block}
  .sidebar{display:none}
  .main{padding:18px 16px 96px}
  .hero h1{font-size:24px}
  .countdown .num{font-size:28px}
  .countdown{text-align:left}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:10.5px}
  .tabbar a.active{color:var(--primary)}
  .phase-banner .pb-right{margin-left:0;text-align:left;width:100%}
  .res-cats{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<script>
(function(){
  'use strict';

  /* ============ 常量与日期 ============ */
  var EXAM = new Date(2026, 11, 12);            // 2026-12-12 考试日
  var START = new Date(2026, 8, 1);             // 2026-09-01 备考第 1 天
  var P1_END = new Date(2026, 8, 27);           // 9/27
  var P2_END = new Date(2026, 10, 1);           // 11/1
  var P3_END = new Date(2026, 10, 29);          // 11/29
  var P4_END = new Date(2026, 11, 11);          // 12/11

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dkey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function daysSinceStart(d){ return Math.round((midnight(d) - midnight(START)) / 86400000); }
  function daysUntilExam(d){ return Math.round((midnight(EXAM) - midnight(d)) / 86400000); }

  /* 阶段判定 */
  function phaseFor(d){
    var t = midnight(d).getTime();
    if (t < midnight(START).getTime()) return 'before';
    if (t <= midnight(P1_END).getTime()) return 'p1';
    if (t <= midnight(P2_END).getTime()) return 'p2';
    if (t <= midnight(P3_END).getTime()) return 'p3';
    if (t <= midnight(P4_END).getTime()) return 'p4';
    if (t === midnight(EXAM).getTime()) return 'exam';
    return 'after';
  }

  /* 周数（1–15，用于 15 格进度带） */
  function weekNo(d){
    var n = daysSinceStart(d) + 1;
    if (n < 1) return 0;
    if (n > 105) return 15;
    var w = Math.ceil(n / 7);
    return Math.min(15, Math.max(1, w));
  }

  /* ============ 数据 ============ */
  var PHASES = [
    { key:'p1', name:'词汇 · 语法地基', weeks:'第 1–4 周', dates:'9/1 – 9/27', tag:'打地基',
      color:'#2C5F5A', soft:'#E4EFEC',
      desc:'先解决“看不懂、听不懂”。4 周内过完约 1500 个四级核心高频词，补齐基础语法，用 0.8 倍速听力热身。',
      weekPlan:[
        '每天 40–60 个新词 + 复习旧词',
        '每天 1 个语法点 + 5 道练习',
        '每天 2 篇简单阅读过渡',
        '每天听力入门 20 分钟（0.8 倍速）',
        '周日复习全周单词 + 半套早年真题（不掐时）'
      ] },
    { key:'p2', name:'分项能力训练', weeks:'第 5–9 周', dates:'9/28 – 11/1', tag:'上强度',
      color:'#3E7C8A', soft:'#E3F0F2',

        + blocksHtml
        + '</div>'

        + '<div class="card"><h2>快捷入口</h2><div class="desc" style="margin-bottom:12px">对应上面任务，点开就练</div>' + QUICK_HTML + '</div>'

        + '<div class="card"><h2>本周总进度</h2><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + pctClamped + '%"></div></div>'
        + '<div class="progress-text"><span>备考第 ' + (daysSinceStart(today)+1) + ' 天 / 共 103 天</span><span>' + pctClamped + '%</span></div></div>'
        + '<div class="desc" style="margin-top:10px">阶段 ' + (phaseIdx+1) + ' / 4 · ' + esc(ph.name) + '（' + esc(ph.dates) + '）</div></div>';
    }

    box.innerHTML = html;
  }

  /* ============ 计划视图 ============ */
  function renderPlan(){
    var box = document.getElementById('view-plan');
    var today = new Date();
    var cur = phaseFor(today);
    var html = '<div class="card"><h2>15 周备考路线</h2>'
      + '<div class="desc">从 9/1 到 12/11，四个阶段由浅入深。每天 2–2.5 小时：早背词、午听力、晚刷题。当天任务在“今日任务”里打卡。</div></div>';

    var tl = '<div class="timeline">';
    for (var i = 0; i < PHASES.length; i++){
      var ph = PHASES[i];
      var isCur = ph.key === cur;
      var tagStyle = 'background:' + ph.soft + ';color:' + ph.color;
      tl += '<div class="tl-node">'
        + '<div class="phase-card">'
        + '<div class="phase-head">'
        + '<span class="phase-dot" style="background:' + ph.color + '"></span>'
        + '<span class="phase-name">' + esc(ph.name) + '</span>'
        + '<span class="phase-meta">' + esc(ph.weeks) + ' · ' + esc(ph.dates) + '</span>'
        + '<span class="phase-tag" style="' + tagStyle + '">' + (isCur ? '当前 · ' : '') + esc(ph.tag) + '</span>'
        + '</div>'
        + '<div class="phase-desc">' + esc(ph.desc) + '</div>'
        + '<div class="phase-body"><h4>每周安排</h4><ul>'
        + ph.weekPlan.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('')
        + '</ul></div>'
        + '</div></div>';
    }
    tl += '</div>';
    html += tl;

    box.innerHTML = html;
  }

  /* ============ 资源视图 ============ */
  function renderResources(){
    var box = document.getElementById('view-resources');
    var html = '<div class="card"><h2>学习资源总表</h2>'
      + '<div class="desc">按板块整理，点击即打开。都来自公开可用的免费渠道，配合今日任务使用。</div></div>';
    html += '<div class="res-cats">';
    RESOURCES.forEach(function(cat){
      html += '<div class="res-cat">'
        + '<div class="res-cat-head"><span class="rc-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/></svg></span><h3>' + esc(cat.cat) + '</h3></div>'
        + '<div class="rc-desc">' + esc(cat.desc) + '</div>';
      cat.items.forEach(function(it){
        html += '<a class="res-item" href="' + esc(it.url) + '" target="_blank" rel="noopener">'
          + '<div class="ri-body"><div class="ri-name">' + esc(it.name) + '</div><div class="ri-note">' + esc(it.note) + '</div></div>'
          + '<span class="ri-go"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></span>'
          + '</a>';
      });
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="external-note">说明：链接指向外部公开资源，如遇失效请告诉我，我会替换为可用地址。打卡与进度数据只存在这台设备浏览器里。</div>';
    box.innerHTML = html;
  }

  /* ============ 日历视图 ============ */
  var CAL_MONTHS = [
    { y:2026, m:8 }, { y:2026, m:9 }, { y:2026, m:10 }, { y:2026, m:11 }
  ];
  var calIndex = 1; // 默认当月（10月=2026年10月）或就近

  function taskTotalForDate(d){
    var p = phaseFor(d);
    if (p !== 'p1' && p !== 'p2' && p !== 'p3' && p !== 'p4') return 0;
    var blocks = TASKS[p];
    var total = 0;
    for (var i = 0; i < blocks.length; i++){
      if (blocks[i].block === 'sunday' && d.getDay() !== 0) continue;
      total += blocks[i].items.length;
    }
    return total;
  }

  function renderCalendar(){
    var box = document.getElementById('view-calendar');
    var today = new Date();
    var cur = CAL_MONTHS[calIndex];
    var y = cur.y, m = cur.m;
    var first = new Date(y, m, 1);
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var startDow = first.getDay();

    var html = '<div class="card">';
    html += '<div class="cal-head"><div class="cal-month">' + y + ' 年 ' + (m+1) + ' 月</div>'
      + '<div class="cal-nav"><button type="button" data-cal="-1" aria-label="上个月"' + (calIndex <= 0 ? ' disabled' : '') + '>&lsaquo;</button>'
      + '<button type="button" data-cal="1" aria-label="下个月"' + (calIndex >= CAL_MONTHS.length-1 ? ' disabled' : '') + '>&rsaquo;</button></div></div>';

    html += '<div class="cal-grid">';
    var dows = ['日','一','二','三','四','五','六'];
    for (var w = 0; w < 7; w++) html += '<div class="cal-dow">' + dows[w] + '</div>';
    for (var s = 0; s < startDow; s++) html += '<div class="cal-cell out"></div>';
    for (var d = 1; d <= daysInMonth; d++){
      var date = new Date(y, m, d);
      var key = dkey(date);
      var p = phaseFor(date);
      var cls = 'cal-cell';
      var bar = '';
      var tag = '';
      if (p === 'before' || p === 'after'){
        cls += ' out';
      } else if (p === 'exam'){
        cls += ' exam';
        tag = '<div class="d" style="color:var(--accent)">' + d + '</div><span style="font-size:10px;color:var(--accent)">考试</span>';
      } else {
        var total = taskTotalForDate(date);
        var done = doneIds(key).length;
        var isToday = key === dkey(today);
        if (isToday) cls += ' today';
        if (total > 0 && done >= total) cls += ' done';
        else if (done > 0) cls += ' partial';
        if (total > 0){
          var ratio = done / total;
          var bw = Math.round(ratio * 100);
          bar = '<div class="cal-bar" style="width:' + bw + '%"></div>';
        }
        if (!isToday){
          tag = '<div class="d">' + d + '</div>';
        } else {
          tag = '<div class="d" style="color:var(--accent)">今天 ' + d + '</div>';
        }
      }
      html += '<div class="' + cls + '">' + (tag || '<div class="d">' + d + '</div>') + bar + '</div>';
    }
    html += '</div>';

    html += '<div class="cal-legend">'
      + '<span><i class="lg-done"></i>全部完成</span>'
      + '<span><i class="lg-part"></i>部分完成</span>'
      + '<span><i class="lg-today"></i>今天</span>'
      + '</div></div>';
    box.innerHTML = html;
  }

  /* ============ 路由（JS 驱动，不依赖浏览器 hash 跳转） ============ */
  function closestEl(el, sel){
    var n = el;
    while (n && n.nodeType === 1){
      if (n.matches && n.matches(sel)) return n;
      n = n.parentNode;
    }
    return null;
  }

  function switchView(route){
    var valid = ['today','plan','resources','calendar'];
    if (valid.indexOf(route) < 0) route = 'today';

    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++){
      views[i].classList.toggle('active', views[i].getAttribute('data-route') === route);
    }
    var navs = document.querySelectorAll('[data-nav]');
    for (var j = 0; j < navs.length; j++){
      navs[j].classList.toggle('active', navs[j].getAttribute('data-nav') === route);
    }

    if (route === 'today') renderToday();
    if (route === 'plan') renderPlan();
    if (route === 'resources') renderResources();
    if (route === 'calendar') renderCalendar();

    try {
      if (location.hash !== '#/' + route) history.replaceState(null, '', '#/' + route);
    } catch(e){ /* 部分沙箱环境不允许改地址，忽略 */ }
  }

  function router(){
    var hash = location.hash || '#/today';
    switchView(hash.replace('#/', ''));
  }

  function bindNav(){
    var links = document.querySelectorAll('a[data-nav]');
    for (var i = 0; i < links.length; i++){
      (function(a){
        a.addEventListener('click', function(ev){
          ev.preventDefault();
          switchView(a.getAttribute('data-nav'));
        });
      })(links[i]);
    }
  }

  function bindInteractions(){
    /* 今日任务勾选：事件委托 */
    var todayView = document.getElementById('view-today');
    todayView.addEventListener('click', function(ev){
      var row = closestEl(ev.target, '.task-item[data-task]');
      if (!row) return;
      if (closestEl(ev.target, 'a')) return;
      toggleTask(dkey(new Date()), row.getAttribute('data-task'));
      renderToday();
      renderCalendar();
    });

    /* 日历翻月：事件委托 */
    var calView = document.getElementById('view-calendar');
    calView.addEventListener('click', function(ev){
      var btn = closestEl(ev.target, 'button[data-cal]');
      if (!btn) return;
      var step = parseInt(btn.getAttribute('data-cal'), 10);
      calIndex += step;
      renderCalendar();
    });

    /* 外链：先拦截默认跳转，优先新窗口打开；被拦截则当前页打开 */
    document.addEventListener('click', function(ev){
      var a = closestEl(ev.target, 'a[href^="http"]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href) return;
      ev.preventDefault();
      var w = null;
      try { w = window.open(href, '_blank'); } catch(e){ w = null; }
      if (w === null){
        try { location.href = href; } catch(e){ /* 忽略 */ }
      }
    });
  }

  /* 全局错误提示（便于发现运行时报错） */
  window.addEventListener('error', function(e){
    var bar = document.getElementById('errbar');
    if (!bar) return;
    bar.style.display = 'block';
    bar.textContent = '脚本错误：' + (e.message || '未知错误');
  });

  /* 初始化：定位到当前月份 */
  (function initCalIndex(){
    var today = new Date();
    for (var i = 0; i < CAL_MONTHS.length; i++){
      if (CAL_MONTHS[i].y === today.getFullYear() && CAL_MONTHS[i].m === today.getMonth()){
        calIndex = i; return;
      }
    }
    // 非备考月份：就近取第一个未过去的月份
    calIndex = 0;
  })();

  renderTop();
  router();
  bindNav();
  bindInteractions();
  window.addEventListener('hashchange', router);

  setInterval(renderTop, 60000); // 每分钟校准日期倒计时
})();
</script>
</body>
</html>
